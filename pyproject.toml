[project]
name = "spendcube"
version = "0.1.0"
description = "Turn raw purchase data and a category tree into a classified, de-duplicated spend cube."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "rapidfuzz>=3.9",
    "scikit-learn>=1.5",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "wandb>=0.18",
    "openpyxl>=3.1.5",
]

[project.scripts]
spendcube = "spendcube.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spendcube"]

[tool.pytest.ini_options]
testpaths = ["tests"]
